<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GraffitiArtist</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Golos+Text:wght@400;600&family=Permanent+Marker&family=Rubik+Wet+Paint&family=Rubik+Glitch&family=Marck+Script&family=Pacifico&family=Rubik:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1c1e;--panel:#26282b;--line:#3a3d41;--text:#eceae4;--mute:#9a9ca0;--accent:#ff2d6f;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e4e2dc;--panel:#f3f1ec;--line:#c9c6bd;--text:#1c1d1f;--mute:#62645f;color-scheme:light}}
:root[data-theme="dark"]{--bg:#1b1c1e;--panel:#26282b;--line:#3a3d41;--text:#eceae4;--mute:#9a9ca0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 "Golos Text",system-ui,sans-serif;min-height:100%}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:980px;margin:0 auto}
h1{margin:0;font:400 clamp(28px,7vw,44px)/1 "Rubik Spray Paint",Impact,sans-serif;letter-spacing:.5px}
h1 span{color:var(--accent)}
header p{margin:0;color:var(--mute);font-size:13px}
main{max-width:980px;margin:0 auto;padding:8px 12px 28px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.thumbs button{flex:0 0 auto;width:84px;height:62px;padding:0;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);cursor:pointer;opacity:.7}
.thumbs button[aria-pressed="true"]{border-color:var(--accent);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.stage{position:relative;background:#000;border-radius:8px;overflow:hidden;display:flex;justify-content:center}
canvas{display:block;max-width:100%;max-height:68vh;width:auto;height:auto;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;pointer-events:none;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.seg{display:flex;gap:6px}
.btn{font:600 14px "Golos Text",system-ui,sans-serif;color:var(--text);background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;min-height:42px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.thumbs button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
input[type=color]{width:38px;height:38px;border:0;padding:0;background:none;cursor:pointer}
label{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
input[type=range]{width:120px;accent-color:var(--accent)}
.grow{flex:1}
input[type=text],select{font:400 15px "Golos Text",system-ui,sans-serif;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
input[type=text]{flex:1 1 160px;min-width:0}
</style>
</head>
<body>
<header><h1>Graffiti<span>Artist</span></h1><p>Оставь свой тег на стене</p></header>
<main>
<div class="thumbs" id="thumbs" role="group" aria-label="Выбери стену"></div>
<div class="stage"><canvas id="cv" aria-label="Холст для граффити"></canvas><div class="hint" id="hint">Проведи по стене пальцем или мышью</div></div>
<div class="bar">
<div class="seg" role="group" aria-label="Инструмент">
<button class="btn" id="t-spray" aria-pressed="true">Баллончик</button>
<button class="btn" id="t-squeeze" aria-pressed="false">Сквизер</button>
<button class="btn" id="t-erase" aria-pressed="false">Ластик</button>
</div>
<div class="sw" id="sw"></div>
<input type="color" id="col" value="#ff2d6f" aria-label="Свой цвет">
<label>Размер <input type="range" id="size" min="8" max="120" value="44"></label>
<label><input type="checkbox" id="drips" checked> Подтёки</label>
<label><input type="checkbox" id="neon"> Неон</label>
<label><input type="checkbox" id="snd"> Звук шипения</label>
<label class="btn" style="cursor:pointer">Своя стена<input type="file" id="file" accept="image/*" hidden></label>
<span class="grow"></span>
<button class="btn" id="undo">Отменить</button>
<button class="btn" id="clear">Стереть всё</button>
<button class="btn" id="save">Сохранить</button>
</div>
<div class="bar">
<input type="text" id="txt" value="Tag" maxlength="24" placeholder="Твой тег" aria-label="Текст тега">
<select id="sty" aria-label="Стиль тега"></select>
<button class="btn" id="t-tag" aria-pressed="false">Написать тег</button>
</div>
</main>

  }else{
    const sp=Math.max(1,size*K*.07),steps=Math.max(1,Math.ceil(d/sp));
    for(let i=1;i<=steps;i++){
      const sx=lx+(x-lx)*i/steps,sy=ly+(y-ly)*i/steps;
      stamp(L,sx,sy);
      if(dripsOn&&rnd()<.018)squeegeeDrip(L,sx,sy);
    }
  }
  lx=x;ly=y;dirty=true;
}
function stepDrips(){
  for(const d of drips){
    if(d.wait>0){d.wait--;continue}
    const L=d.L,ny=d.y+d.v;
    L.globalAlpha=1;L.strokeStyle=d.c;L.fillStyle=d.c;L.lineCap='round';
    L.lineWidth=d.w*.7;L.beginPath();L.moveTo(d.x,d.y);L.lineTo(d.x,ny);L.stroke();
    L.beginPath();L.arc(d.x,ny,d.w*.55,0,6.283);L.fill();
    d.y=ny;d.run+=d.v;d.v*=.994;d.w*=.9985;
    if(d.run>d.max||d.v<.08)d.done=true;
    dirty=true;
  }
  drips=drips.filter(d=>!d.done);
}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  snap();if(snd){audio();ac.resume()}down=true;dwell=0;[px,py]=pos(e);lx=px;ly=py;$('#hint').style.display='none';
  if(tool==='tag'){down=false;placeTag(px,py);return}
  if(tool==='squeeze'){stamp(LC(),px,py);dirty=true}
});
cv.addEventListener('pointermove',e=>{if(down)[px,py]=pos(e)});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{down=false}));
function loop(){
  if(gain)gain.gain.setTargetAtTime(snd&&down&&tool==='spray'?.12:0,ac.currentTime,.03);
  if(down){
    if(tool==='spray')strokeTo(px,py);
    else if(px!==lx||py!==ly)strokeTo(px,py);
  }
  stepDrips();
  if(dirty){render();dirty=false}
  requestAnimationFrame(loop);
}

// UI
const SW=['#ff2d6f','#ff7a00','#ffe600','#3dff6e','#00d5ff','#3d5bff','#b44dff','#ffffff','#111111'];
SW.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Цвет '+c);b.setAttribute('aria-pressed',c===color);b.onclick=()=>setColor(c);$('#sw').appendChild(b)});
function setColor(c){color=c;$('#col').value=c;document.querySelectorAll('#sw button').forEach(b=>b.setAttribute('aria-pressed',b.style.background&&rgb2hex(b.style.background)===c))}
function rgb2hex(s){const m=s.match(/\d+/g);return m?'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join(''):s}
$('#col').oninput=e=>setColor(e.target.value);
$('#size').oninput=e=>size=+e.target.value;
$('#drips').onchange=e=>dripsOn=e.target.checked;
function setTool(t){tool=t;if(t==='tag'){const h=$('#hint');h.textContent='Тапни по стене, чтобы поставить тег';h.style.display='block'}['spray','squeeze','erase','tag'].forEach(n=>$('#t-'+n).setAttribute('aria-pressed',t===n))}
$('#t-spray').onclick=()=>setTool('spray');$('#t-squeeze').onclick=()=>setTool('squeeze');$('#t-erase').onclick=()=>setTool('erase');
const R_=(L,t,x,y)=>L.fillText(t,x,y);
const STY={
 marker:{n:'Маркер',f:'Permanent Marker',w:400,dr:2,d(L,t,fs){L.fillStyle=color;L.fillText(t,0,0)}},
 wet:{n:'Текучий',f:'Rubik Wet Paint',w:400,dr:6,d(L,t,fs){L.fillStyle=color;L.fillText(t,0,0)}},
 spray:{n:'Баллон',f:'Rubik Spray Paint',w:400,dr:3,d(L,t,fs){L.shadowColor=color;L.shadowBlur=fs*.1;L.fillStyle=color;L.fillText(t,0,0);L.fillText(t,0,0)}},
 bubble:{n:'Бомбинг',f:'Rubik',w:900,dr:3,d(L,t,fs){L.fillStyle='rgba(0,0,0,.45)';L.fillText(t,fs*.05,fs*.07);L.strokeStyle='#111';L.lineWidth=fs*.24;L.strokeText(t,0,0);L.strokeStyle='#fff';L.lineWidth=fs*.12;L.strokeText(t,0,0);L.fillStyle=color;L.fillText(t,0,0)}},
 script:{n:'Росчерк',f:'Marck Script',w:400,dr:1,d(L,t,fs){L.strokeStyle='#fff';L.lineWidth=fs*.09;L.strokeText(t,0,0);L.fillStyle=color;L.fillText(t,0,0)}},
 neon:{n:'Неон',f:'Pacifico',w:400,dr:0,d(L,t,fs){L.shadowColor=color;L.shadowBlur=fs*.4;L.strokeStyle=color;L.lineWidth=fs*.09;L.strokeText(t,0,0);L.strokeText(t,0,0);L.shadowBlur=fs*.1;L.strokeStyle='#fff';L.lineWidth=fs*.03;L.strokeText(t,0,0)}},
 glitch:{n:'Глитч',f:'Rubik Glitch',w:400,dr:0,d(L,t,fs){L.globalAlpha=.85;L.fillStyle='#00e5ff';L.fillText(t,-fs*.04,0);L.fillStyle='#ff2d6f';L.fillText(t,fs*.04,0);L.globalAlpha=1;L.fillStyle=color;L.fillText(t,0,0)}},
 d3:{n:'Объём',f:'Rubik',w:900,dr:2,d(L,t,fs){L.fillStyle='#1a1a1a';for(let i=fs*.14;i>0;i-=1)L.fillText(t,i*.7,i);L.strokeStyle='#111';L.lineWidth=fs*.04;L.strokeText(t,0,0);L.fillStyle=color;L.fillText(t,0,0);L.strokeStyle='rgba(255,255,255,.7)';L.lineWidth=fs*.015;L.strokeText(t,0,0)}}
};
Object.entries(STY).forEach(([k_,s])=>{const o=document.createElement('option');o.value=k_;o.textContent=s.n;$('#sty').appendChild(o)});
async function placeTag(x,y){
 const text=($('#txt').value||'Tag').slice(0,24),s=STY[$('#sty').value],K=k(),L=LC();
 let fs=size*K*2;
 try{await document.fonts.load(`${s.w} ${fs}px "${s.f}"`,text)}catch(e){}
 L.save();L.font=`${s.w} ${fs}px "${s.f}", sans-serif`;
 let w=L.measureText(text).width;const mx=cv.width*.92;
 if(w>mx){fs*=mx/w;w=mx;L.font=`${s.w} ${fs}px "${s.f}", sans-serif`}
 L.translate(x,y);L.rotate(-.07);L.textAlign='center';L.textBaseline='middle';L.lineJoin='round';
 s.d(L,text,fs);L.restore();
 if(dripsOn)for(let i=0;i<s.dr;i++)addDrip(x+(rnd()-.5)*w*.8,y+fs*.35,fs*.03+1.5,.5+rnd()*.7,fs*(.4+rnd()*1.4),rnd()*30,L);
 dirty=true;
}
$('#t-tag').onclick=()=>setTool('tag');
$('#txt').oninput=()=>setTool('tag');$('#sty').onchange=()=>setTool('tag');
let neon=false,snd=false,ac,gain;
$('#neon').onchange=e=>neon=e.target.checked;$('#snd').onchange=e=>snd=e.target.checked;
function audio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=3500;gain=ac.createGain();gain.gain.value=0;s.connect(f);f.connect(gain);gain.connect(ac.destination);s.start()}
function addThumb(o,i){const b=document.createElement('button');b.setAttribute('aria-label',o.name);b.innerHTML='<img alt="'+o.name+'" src="'+o.src+'">';b.onclick=()=>select(i);$('#thumbs').appendChild(b)}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const o={name:'Моя стена',src:c.toDataURL('image/jpeg',.85)},i2=new Image();i2.onload=()=>{o.img=i2;IMGS.push(o);st.push({layer:null,hist:[]});addThumb(o,IMGS.length-1);select(IMGS.length-1);$('#thumbs').scrollLeft=1e5};i2.src=o.src};im.src=fr.result};fr.readAsDataURL(f);e.target.value=''};
$('#undo').onclick=()=>{const h=st[cur].hist;if(!h.length)return;const l=st[cur].layer,c=l.getContext('2d');drips=drips.filter(d=>d.L!==c);c.clearRect(0,0,l.width,l.height);c.drawImage(h.pop(),0,0);dirty=true};
$('#clear').onclick=()=>{snap();const l=st[cur].layer,c=l.getContext('2d');drips=drips.filter(d=>d.L!==c);c.clearRect(0,0,l.width,l.height);dirty=true};
$('#save').onclick=()=>{render();const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='graffiti-'+(cur+1)+'.png';a.click()};
IMGS.forEach((o,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',o.name);b.innerHTML='<img alt="'+o.name+'" src="'+o.src+'">';b.onclick=()=>select(i);$('#thumbs').appendChild(b)});
Promise.all(IMGS.map(o=>new Promise(r=>{o.img=new Image();o.img.onload=r;o.img.src=o.src}))).then(()=>{select(0);loop()});
</script>
